{% extends "base.html" %}
{% block pagetitle %}فراموشی رمز عبور{% endblock %}

{% block content %}
<section class="login-section">
  <div class="container login-container">
    <div class="login-card">
      <div class="login-icon" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2"></rect>
          <path d="M9 7h6M9 11h6M9 15h3"></path>
        </svg>
      </div>
      <h1 class="login-title">فراموشی رمز عبور</h1>
      <p class="login-sub">شماره تلفن حساب خود را وارد کنید؛ رمز عبور جدید با پیامک برای شما ارسال می‌شود.</p>

      <form method="post" action="{{ url_for('account.forgot_password_page') }}">
        <input type="hidden" name="{{ CSRF_FIELD }}" value="{{ csrf_token() }}">
        <div class="fld">
          <label for="fphone">شماره تلفن</label>
          <input id="fphone" name="phone" type="tel" required inputmode="tel" dir="ltr"
                 autocomplete="tel" placeholder="09xxxxxxxxx"
                 value="{{ request.form.get('phone', '') }}">
        </div>
        <button type="submit" class="btn btn-primary btn-full">ارسال پیامک رمز جدید</button>
      </form>
      <div class="login-links">
        <a href="{{ url_for('account.unified_login') }}">بازگشت به صفحه ورود</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
